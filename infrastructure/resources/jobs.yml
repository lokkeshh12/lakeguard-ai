resources:
  jobs:
    lakeguard_orders:
      name: lakeguard-orders-${bundle.target}
      tasks:
        - task_key: bronze
          spark_python_task:
            python_file: ../../pipelines/bronze.py
            parameters:
              - --source
              - ${var.source_path}
              - --target
              - ${var.catalog}.${var.schema}.bronze_orders
              - --checkpoint
              - ${var.checkpoint_root}/bronze
              - --schema-location
              - ${var.checkpoint_root}/schema
          new_cluster: &cluster
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
        - task_key: silver
          depends_on: [{task_key: bronze}]
          spark_python_task:
            python_file: ../../pipelines/silver.py
            parameters: [--bronze, '${var.catalog}.${var.schema}.bronze_orders', --silver, '${var.catalog}.${var.schema}.silver_orders', --quarantine, '${var.catalog}.${var.schema}.quarantine_orders']
          new_cluster: *cluster
        - task_key: gold
          depends_on: [{task_key: silver}]
          spark_python_task:
            python_file: ../../pipelines/gold.py
            parameters: [--silver, '${var.catalog}.${var.schema}.silver_orders', --gold, '${var.catalog}.${var.schema}.gold_daily_orders']
          new_cluster: *cluster
