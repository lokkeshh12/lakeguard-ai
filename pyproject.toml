[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "lakeguard-ai"
version = "0.1.0"
description = "Policy-gated agentic data reliability for Databricks"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3", "requests>=2.31,<3"]
[project.optional-dependencies]
agent = ["langgraph>=0.2,<2", "mlflow>=2.15,<4"]
spark = ["pyspark>=3.5,<5", "delta-spark>=3.2,<5"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
[tool.setuptools.packages.find]
include = ["lakeguard*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
